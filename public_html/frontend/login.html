<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenique | Login</title>
  <link rel="icon" type="image/x-icon" href="images/logo2.png">  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="theme-toggle.js"></script> 
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-card">

        <div class="auth-left">
          <div class="auth-content">
            <div class="logo">
              <a href="homepage.html">
                <img src="images/logo2.png" alt="Serenique Logo" class="logo-img" />
              </a>
              <h2>Welcome Back</h2> 
            </div>

            <form class="auth-form" action="login.php" method="POST">
              <h3>Login to Your Account</h3>

              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="Enter your email" required>

              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>

              <div class="extra-links">
                <a href="#">Forgot Password?</a>
              </div>
              
              <button type="submit" class="btn-primary">Login</button>

              <p class="small-text">
                Don't have an account? <a href="register.html">Register here</a>
              </p>
            </form>

            <div class="text-center mt-3">
                 <!-- Dark Mode Toggle Button -->
                <button id="mode-toggle" class="btn p-0 border-0" aria-label="Toggle Light and Dark Mode">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                        <path id="moon-icon" d="M6 .278a.76.76 0 0 0-.154.198 2.035 2.035 0 0 0 .981 3.511 2.035 2.035 0 0 1 .981 3.511C3.896 9.47 2.1 6.255 2.1 4.793c0-2.208 1.62-3.801 3.488-3.995a.76.76 0 0 0 .312-.511.76.76 0 0 0-.012-.416C5.69 0 5.4 0 5.104 0h-.002zm1.884 7.29a.76.76 0 0 0-.154.198 2.035 2.035 0 0 0 .981 3.511 2.035 2.035 0 0 1 .981 3.511c-2.43 1.25-4.576.994-5.892-.093a.76.76 0 0 0-.012-.416C4.42 16 4.124 16 3.828 16h-.002z"/>
                        <path id="sun-icon" class="d-none" fill-rule="evenodd" d="M10.5 7a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2a.5.5 0 0 1 .5-.5zm.5 4.5a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zM4 11.5a.5.5 0 0 0 0 1H2a.5.5 0 0 0 0-1h2zM7.5 3a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5zM4.5 4a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1h-2zM4.5 8a.5.5 0 0 1 0 1h2a.5.5 0 0 1 0-1h-2zM7.5 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 7.5 0z"/>
                    </svg>
                </button>
            </div>
          </div>
        </div>

        <!-- Right side (Illustrative image/text) -->
        <div class="auth-right d-none d-md-flex">
          <div class="overlay-text">
            <h3>Clean Beauty for Your Natural Glow</h3>
            <p>
              Log in to manage your orders, favorites, and exclusive membership rewards.
            </p>
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
